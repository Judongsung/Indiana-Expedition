name: Draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Source version to release (major.minor.patch)
        required: true
        default: 0.3.0
        type: string

permissions:
  contents: write

concurrency:
  group: draft-release
  cancel-in-progress: false

jobs:
  draft-release:
    name: Build Draft Release
    runs-on: windows-2022
    env:
      REQUESTED_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Validate source and release target
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_REF -ne "refs/heads/main") {
            throw "Draft Release는 main 기준으로만 만들 수 있습니다: $env:GITHUB_REF"
          }

          ./scripts/verify-version.ps1 -ExpectedVersion $env:REQUESTED_VERSION | Out-Host
          $tag = "v$env:REQUESTED_VERSION"
          if ((git tag --list $tag).Count -gt 0) {
            throw "같은 태그가 이미 있습니다: $tag"
          }

          $encodedTag = [Uri]::EscapeDataString($tag)
          $releaseUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$encodedTag"
          $releaseResponse = Invoke-WebRequest `
            -Uri $releaseUri `
            -Headers @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
            } `
            -SkipHttpErrorCheck
          if ($releaseResponse.StatusCode -eq 200) {
            throw "같은 Release가 이미 있습니다: $tag"
          }
          if ($releaseResponse.StatusCode -ne 404) {
            throw "기존 Release 확인에 실패했습니다. HTTP $($releaseResponse.StatusCode)"
          }

      - name: Run common verification
        shell: pwsh
        run: ./scripts/verify.ps1

      - name: Create ZIP and checksum
        id: package
        shell: pwsh
        run: |
          $package = ./scripts/package-release.ps1 -Version $env:REQUESTED_VERSION
          $package | Format-List | Out-Host
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "zip_path=$($package.ZipPath)"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "checksum_path=$($package.ChecksumPath)"

      - name: Create Draft Release
        shell: pwsh
        env:
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksum_path }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "v$env:REQUESTED_VERSION"
          git tag $tag $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) {
            throw "현재 커밋에 태그를 만들지 못했습니다: $tag"
          }
          git push origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "태그를 원격 저장소에 푸시하지 못했습니다: $tag"
          }

          gh release create $tag `
            $env:ZIP_PATH `
            $env:CHECKSUM_PATH `
            --draft `
            --generate-notes `
            --verify-tag `
            --title "Indiana Expedition $env:REQUESTED_VERSION"
          if ($LASTEXITCODE -ne 0) {
            throw "Draft Release 생성에 실패했습니다."
          }
